name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test with coverage
        run: >-
          uv run pytest
          --cov=risk_ledger
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Audit frozen production dependencies
        run: make audit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Build non-root image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag risk-ledger:ci .

      - name: Start hardened container
        run: >-
          docker run
          --detach
          --name risk-ledger-ci
          --read-only
          --tmpfs /tmp
          --security-opt no-new-privileges:true
          --cap-drop ALL
          --publish 127.0.0.1:8000:8000
          risk-ledger:ci

      - name: Verify container health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs risk-ledger-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force risk-ledger-ci
